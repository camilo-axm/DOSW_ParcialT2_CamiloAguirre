
services:
  postgres:
    image: postgres:16
    container_name: dosw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dosw_parcial
      POSTGRES_USER: dosw_user
      POSTGRES_PASSWORD: dosw_local_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dosw_user -d dosw_parcial"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
